<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure PayBeforeBite platform administrator sign-in">
  <meta name="robots" content="noindex, nofollow">
  <title>PayBeforeBite | Admin Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><span class="login-logo" aria-hidden="true">🍽️</span><strong>PayBeforeBite</strong></div>
      <p class="eyebrow">RESTRICTED ACCESS</p>
      <h1 id="loginTitle">Platform administrator sign in</h1>
      <p class="login-subtitle">Sign in with an authorized platform administrator account.</p>
      <form id="adminLoginForm" class="login-form">
        <label for="adminEmail">Email address</label>
        <input id="adminEmail" name="email" type="email" class="text-input" autocomplete="username" required>
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" class="text-input" autocomplete="current-password" required>
        <button id="adminLoginButton" class="primary-btn" type="submit">Sign in</button>
      </form>
      <p id="adminLoginMessage" class="login-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
